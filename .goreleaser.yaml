# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: gitport

before:
  hooks:
    - go mod tidy

builds:
  - id: gitport
    main: ./cmd/gitport
    binary: gitport
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "merge pull request"
      - "Merge branch"

release:
  github:
    owner: nim-sam
    name: gitport
  prerelease: auto
